<!DOCTYPE html>
<html lang="pt">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <title>Schedule Primavera</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="stylesheet" href="./css/style.css?v=4">
</head>

<body>
  <div class="content">
    <div class="hero">
      <img class="hero-logo" src="./assets/primalogo.png" alt="Primavera Sound Logo" />
      <div class="hero-text">
        <span>Primavera Sound</span>
        <span>Porto</span>
      </div>
    </div>
    <div id="schedule"></div>
    <div class="selected-artists" id="selected-artists">
      <div class="selected-header">
        <div class="selected-title-group">
          <span class="selected-kicker">Your list</span>
          <h2>Primavera Sound Porto</h2>
        </div>
      </div>
      <div class="selected-divider"></div>
      <div id="selected-artists-list"></div>
      <div class="action-buttons">
        <button id="download-image" title="Guardar imagem">Export</button>
        <button id="create-group" title="Create a new group">Create Group</button>
        <button id="join-group" title="Join an existing group">Join Group</button>
        <button id="leave-group" title="Exit Group" style="display:none;">Exit Group</button>
      </div>
      <div id="active-group-info"
        style="display: none; text-align: center; margin-top: 1rem; font-weight: 700; color: #555;">
        Code: <span id="group-code-display" style="color: var(--coral); font-size: 1.2rem; user-select: text;"></span>
      </div>
    </div>
  </div>

  <!-- Custom Alert / Toast -->
  <div id="flash-message" class="flash-message"></div>

  <!-- Create Group Modal -->
  <div id="create-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>Create Group</h3>
      <p style="font-size: 0.9rem; margin-bottom: 0.5rem; color: #666;">A group will be created with an automatic code.
      </p>
      <input type="text" id="create-name-input" placeholder="Your name" autocomplete="off" />
      <div class="modal-actions">
        <button id="create-cancel" class="btn-cancel">Cancel</button>
        <button id="create-confirm" class="btn-confirm">Create</button>
      </div>
    </div>
  </div>

  <!-- Join Group Modal -->
  <div id="join-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>Join Group</h3>
      <p style="font-size: 0.9rem; margin-bottom: 0.5rem; color: #666;">Ask your friend for the code to join.</p>
      <input type="text" id="join-code-input" placeholder="Group Code" autocomplete="off" />
      <input type="text" id="join-name-input" placeholder="Your name" autocomplete="off" />
      <div class="modal-actions">
        <button id="join-cancel" class="btn-cancel">Cancel</button>
        <button id="join-confirm" class="btn-confirm">Join</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module" src="./js/script.js"></script>
</body>

</html>
