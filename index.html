<!DOCTYPE html>
<html lang="pt">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <title>Schedule Primavera</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <div class="content">
    <div class="hero">
      <img class="hero-logo" src="./assets/primalogo.png" alt="Primavera Sound Logo" />
      <div class="hero-text">
        <span>Primavera Sound</span>
        <span>Porto</span>
      </div>
    </div>
    <div id="schedule"></div>
    <div class="selected-artists" id="selected-artists">
      <div class="selected-header">
        <div class="selected-title-group">
          <span class="selected-kicker">Lista</span>
          <h2>Primavera Sound Porto</h2>
        </div>
      </div>
      <div class="selected-divider"></div>
      <div id="selected-artists-list"></div>
      <div class="action-buttons">
        <button id="download-image" title="Guardar imagem">Export</button>
        <button id="share-schedule" title="Partilhar horário">Share</button>
        <button id="clear-friends" title="Remover amigos" style="display:none;">Clean Friends</button>
      </div>
    </div>
  </div>

  <!-- Custom Alert / Toast -->
  <div id="flash-message" class="flash-message"></div>

  <!-- Custom Name Prompt Modal -->
  <div id="name-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>Share Schedule</h3>
      <input type="text" id="name-input" placeholder="Your name" autocomplete="off" />
      <div class="modal-actions">
        <button id="name-cancel" class="btn-cancel">Cancel</button>
        <button id="name-confirm" class="btn-confirm">Share</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./js/script.js"></script>
</body>

</html>
